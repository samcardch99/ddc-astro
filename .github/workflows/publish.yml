name: Publish

# Mirrors the deployment the React project used: build on main, push the static
# output to the `build` branch — and upload the same output to Hostinger over
# FTPS, so the live site moves with the merge instead of waiting for a manual
# pull. The `build` branch stays as the deployment record and rollback source.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN is read-only by default on new repositories, so pushing the
# built output to the `build` branch has to be granted explicitly.
permissions:
  contents: write

# Two merges landing seconds apart start two runs that both try to push `build`,
# and the loser fails on a non-fast-forward. Only one run may hold the branch at
# a time; a third push supersedes the one still waiting, since it would build
# from the same tip anyway.
concurrency:
  group: publish-build-branch
  cancel-in-progress: false

jobs:
  build:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.PUBLIC_EMAILJS_SERVICE_ID }}
      PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_TEMPLATE_ID }}
      PUBLIC_EMAILJS_INVESTMENTS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_INVESTMENTS_TEMPLATE_ID }}
      PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.PUBLIC_EMAILJS_PUBLIC_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-assets-

      - run: npm run build

      - name: Push to build branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: build
          FOLDER: dist
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"

      # The action keeps a manifest on the server and uploads only what changed,
      # so a routine copy edit moves a handful of files rather than the whole
      # site. Set the FTP_SERVER_DIR repository variable if the FTP account
      # lands somewhere other than public_html — an account scoped to the domain
      # root wants './' instead.
      - name: Deploy to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Astro fingerprints its assets, so stale files are inert rather than
          # wrong; leaving them costs disk but never serves the wrong bundle.
          dangerous-clean-slate: false
